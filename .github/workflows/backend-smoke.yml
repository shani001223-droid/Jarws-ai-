name: HOSHI live backend smoke test

on:
  push:
    branches: [main]
    paths:
      - "cloud_backend/main.py"
      - ".github/workflows/backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for the updated Render backend
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 30); do
            if health=$(curl -fsS --max-time 10 "$API_BASE/health"); then
              if echo "$health" | jq -e ' .service == "hoshi-cloud-api" and .version == "0.9.1" and .gemini_api == "interactions" and .gemini_model == "gemini-3.8-flash" and .groq_model == "openai/gpt-oss-20b" and .ai_connected == true' >/dev/null; then
                echo "$health" | jq '{version, gemini_api, gemini_model, groq_model, groq_configured, ai_connected}'
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Timed out waiting for the updated backend. Last health response: $health"
              exit 1
            fi
            sleep 5
          done
      - name: Send one live AI request
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          body=""
          http_code="000"
          # Render can briefly return 502/503/504 while an automatic deploy or
          # cold start settles. Retry transient gateway/service failures.
          for attempt in 1 2 3; do
            http_code=$(curl -sS --max-time 60 -o /tmp/hoshi-live-reply.json -w '%{http_code}' \
              -X POST "$API_BASE/api/assistant" \
              -H 'Content-Type: application/json' \
              --data '{"message":"Automated live smoke test. Reply with exactly: HOSHI OK.","locale":"en"}' || true)
            body=$(cat /tmp/hoshi-live-reply.json 2>/dev/null || true)
            if [ "$http_code" = "200" ]; then
              if echo "$body" | jq -e '(.reply | type == "string" and length > 0) and (.mode == "gemini" or .mode == "groq")' >/dev/null; then
                echo "PASS — live AI provider: $(echo "$body" | jq -r '.mode')"
                echo "Reply: $(echo "$body" | jq -r '.reply')"
                exit 0
              fi
              echo "HTTP 200 returned invalid assistant JSON on attempt $attempt"
              echo "$body"
              exit 1
            fi
            echo "Live assistant request returned HTTP $http_code on attempt $attempt"
            if [ "$http_code" != "000" ] && [ "$http_code" != "502" ] && [ "$http_code" != "503" ] && [ "$http_code" != "504" ]; then
              echo "$body"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Live assistant request failed after retries (HTTP $http_code)"
          echo "$body"
          exit 1
