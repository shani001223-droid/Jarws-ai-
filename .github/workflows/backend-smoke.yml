name: HOSHI live backend smoke test

on:
  push:
    branches: [main]
    paths:
      - "cloud_backend/main.py"
      - ".github/workflows/backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for the updated Render backend
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 30); do
            if health=$(curl -fsS --max-time 10 "$API_BASE/health"); then
              if echo "$health" | jq -e ' .service == "hoshi-cloud-api" and .version == "0.9.1" and .gemini_api == "interactions" and .gemini_model == "gemini-3.8-flash" and .groq_model == "openai/gpt-oss-20b" and .ai_connected == true and .reply_fallback_enabled == true and .voice_fast_path == true' >/dev/null; then
                echo "$health" | jq '{version, gemini_api, gemini_model, groq_model, groq_configured, ai_connected}'
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Timed out waiting for the updated backend. Last health response: $health"
              exit 1
            fi
            sleep 5
          done
      - name: Verify public API deployment and upstream status
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            registry=$(curl -fsS --max-time 12 "$API_BASE/api/public/sources" || true)
            if echo "$registry" | jq -e '.key_required == false and .sources.binance_spot and .sources.fear_greed and .sources.defillama' >/dev/null 2>&1; then
              echo "PASS — deployed public API registry is present"
              ready=1
              break
            fi
            sleep 8
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL — public API routes are not available on the live backend"
            exit 1
          fi
          for endpoint in 'market?symbol=BTCUSDT' 'candles?symbol=BTCUSDT&interval=5m' 'sentiment'; do
            code=$(curl -sS --max-time 15 -o /tmp/hoshi-public.json -w '%{http_code}' "$API_BASE/api/public/$endpoint" || true)
            echo "Public $endpoint: HTTP $code"
            if [ "$code" = "200" ]; then
              jq -e '.source and .fetched_at' /tmp/hoshi-public.json >/dev/null
            elif [ "$code" = "503" ]; then
              echo "WARN — provider unavailable from Render; UI must not invent data"
            else
              echo "FAIL — unexpected public API status for $endpoint"
              cat /tmp/hoshi-public.json || true
              exit 1
            fi
          done
      - name: Send one live AI request
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          body=""
          http_code="000"
          # Render can briefly return 502/503/504 while an automatic deploy or
          # cold start settles. Retry transient gateway/service failures.
          for attempt in 1 2 3; do
            http_code=$(curl -sS --max-time 60 -o /tmp/hoshi-live-reply.json -w '%{http_code}' \
              -X POST "$API_BASE/api/assistant" \
              -H 'Content-Type: application/json' \
              --data '{"message":"Automated live smoke test. Reply with exactly: HOSHI OK.","locale":"en"}' || true)
            body=$(cat /tmp/hoshi-live-reply.json 2>/dev/null || true)
            if [ "$http_code" = "200" ]; then
              if echo "$body" | jq -e '(.reply | type == "string" and length > 0) and (.mode == "gemini" or .mode == "groq" or .mode == "openrouter")' >/dev/null; then
                echo "PASS — live AI provider: $(echo "$body" | jq -r '.mode')"
                echo "Reply: $(echo "$body" | jq -r '.reply')"
                exit 0
              fi
              echo "HTTP 200 returned invalid assistant JSON on attempt $attempt"
              echo "$body"
              exit 1
            fi
            echo "Live assistant request returned HTTP $http_code on attempt $attempt"
            if [ "$http_code" != "000" ] && [ "$http_code" != "502" ] && [ "$http_code" != "503" ] && [ "$http_code" != "504" ]; then
              echo "$body"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Live assistant request failed after retries (HTTP $http_code)"
          echo "$body"
          exit 1

      - name: Check live Roman Urdu reply and Urdu speech text
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            status=$(curl -sS --max-time 62 -o /tmp/hoshi-urdu-test.json -w '%{http_code}' \
              -X POST "$API_BASE/api/assistant" -H 'Content-Type: application/json' \
              --data '{"message":"Hoshi, tum kaisi ho? Roman Urdu mein chhota sa jawab do.","locale":"ur-PK"}' || true)
            if [ "$status" = "200" ]; then
              if python -c 'import json,re,sys; d=json.load(sys.stdin); assert isinstance(d.get("reply"),str) and len(d["reply"].strip())>3; assert not d["reply"].lstrip().startswith("{"); assert isinstance(d.get("speech_text"),str) and re.search(r"[\u0600-\u06ff]",d["speech_text"]); assert d.get("mode") in ("openrouter","gemini","groq")' < /tmp/hoshi-urdu-test.json; then
                echo "PASS — live Roman Urdu and Urdu TTS response are structurally valid"
                exit 0
              fi
              echo "WARN — reply formatting or Urdu speech text invalid on attempt $attempt"
            else
              echo "WARN — assistant returned HTTP $status on attempt $attempt"
            fi
            if [ "$attempt" -lt 2 ]; then sleep 6; fi
          done
          echo "FAIL — live Urdu conversational path did not pass validation"
          exit 1

      - name: Measure actual fast spoken-response time
        env:
          API_BASE: https://jarws-ai-2.onrender.com
        run: |
          set -euo pipefail
          timing=$(curl -sS --max-time 38 -o /tmp/hoshi-voice-speed.json -w '%{http_code} %{time_total}' \
            -X POST "$API_BASE/api/assistant" -H 'Content-Type: application/json' \
            --data '{"message":"Hoshi, aaj kaisi ho? Jawab chhota rakho.","locale":"ur-PK","fast":true}' || echo "000 0")
          echo "Fast spoken AI response: $timing (HTTP and seconds, network included, audio not included)"
          code=$(echo "$timing" | awk '{print $1}')
          if [ "$code" = "200" ]; then
            jq -e '.reply and (.mode=="groq" or .mode=="openrouter" or .mode=="gemini")' /tmp/hoshi-voice-speed.json >/dev/null
            jq '{mode, reply_length:(.reply|length), urdu_speech_text_present:(.speech_text != null)}' /tmp/hoshi-voice-speed.json
            echo "PASS — fast path gives a usable reply"
          else
            echo "WARN — voice fast-provider call unavailable during this measurement; existing AI path remains"
          fi
