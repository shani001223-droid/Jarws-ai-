name: HOSHI V3 knowledge integrity

on:
  push:
    branches: [hoshi-v3-god-mode]
    paths:
      - "knowledge_base/**"
      - "PROGRESS.md"
      - "scripts/check_v3_knowledge.py"
      - "scripts/v3_structure_evidence.py"
      - "tests/test_v3_structure_evidence.py"
      - "scripts/v3_pattern_evidence.py"
      - "tests/test_v3_pattern_evidence.py"
      - "scripts/v3_zone_evidence.py"
      - "tests/test_v3_zone_evidence.py"
      - "scripts/v3_smc_evidence.py"
      - "tests/test_v3_smc_evidence.py"
      - "scripts/v3_ict_evidence.py"
      - "tests/test_v3_ict_evidence.py"
      - "scripts/v3_liquidity_evidence.py"
      - "tests/test_v3_liquidity_evidence.py"
      - "scripts/v3_fvg_evidence.py"
      - "tests/test_v3_fvg_evidence.py"
      - "scripts/v3_indicator_evidence.py"
      - "tests/test_v3_indicator_evidence.py"
      - "scripts/v3_news_evidence.py"
      - "tests/test_v3_news_evidence.py"
      - "scripts/v3_risk_evidence.py"
      - "tests/test_v3_risk_evidence.py"
      - "scripts/v3_macro_evidence.py"
      - "tests/test_v3_macro_evidence.py"
      - ".github/workflows/trading-v3-knowledge.yml"
  pull_request:
    branches: [main]
    paths:
      - "knowledge_base/**"
      - "scripts/check_v3_knowledge.py"
      - "scripts/v3_structure_evidence.py"
      - "tests/test_v3_structure_evidence.py"
      - "scripts/v3_pattern_evidence.py"
      - "tests/test_v3_pattern_evidence.py"
      - "scripts/v3_zone_evidence.py"
      - "tests/test_v3_zone_evidence.py"
      - "scripts/v3_smc_evidence.py"
      - "tests/test_v3_smc_evidence.py"
      - "scripts/v3_ict_evidence.py"
      - "tests/test_v3_ict_evidence.py"
      - "scripts/v3_liquidity_evidence.py"
      - "tests/test_v3_liquidity_evidence.py"
      - "scripts/v3_fvg_evidence.py"
      - "tests/test_v3_fvg_evidence.py"
      - "scripts/v3_indicator_evidence.py"
      - "tests/test_v3_indicator_evidence.py"
      - "scripts/v3_news_evidence.py"
      - "tests/test_v3_news_evidence.py"
      - "scripts/v3_risk_evidence.py"
      - "tests/test_v3_risk_evidence.py"
      - "scripts/v3_macro_evidence.py"
      - "tests/test_v3_macro_evidence.py"
      - ".github/workflows/trading-v3-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curriculum-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check minimum body words, required sections, examples and SHA receipts
        run: python scripts/check_v3_knowledge.py
      - name: Verify historical OHLC and pattern evidence, causal prefixes and missing outcomes
        run: python -m unittest discover -s tests -p 'test_v3_*_evidence.py' -v
