name: JARVIS basic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend Python syntax
        run: python -m compileall -q cloud_backend
      - name: Install backend dependencies
        run: python -m pip install -r cloud_backend/requirements.txt
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test natural-language reminder parser
        run: node --test tests/reminder-parser.test.cjs
      - name: Check reminder parser JavaScript syntax
        run: node --check reminder-parser.js
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
      - name: Check dashboard inline JavaScript syntax
        run: |
          node -e 'const fs = require("node:fs"); const html = fs.readFileSync("index.html", "utf8"); const match = html.match(/<script>([\s\S]*?)<\/script>/i); if (!match) { throw new Error("No inline script found in index.html"); } new Function(match[1]); console.log("Dashboard JavaScript syntax: OK");'
