name: HOSHI basic checks

on:
  push:
    branches: [main, hoshi/dnd-foundation-20261026]
    paths:
      - "cloud_backend/**"
      - "modules/**"
      - "HOSHI_SYSTEM_PROMPT_FINAL.txt"
      - "scripts/build_trading_knowledge.py"
      - "requirements-dev.txt"
      - "requirements-test.txt"
      - "speech-pipeline.js"
      - "profile-*.js"
      - "profile-memory.html"
      - "hoshi-*.mjs"
      - "hoshi-*.css"
      - "android/**"
      - "tests/**"
      - "game-studio/**"
      - "index.html"
      - "sw.js"
      - "hoshi-*.js"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend Python syntax
        run: python -m compileall -q cloud_backend
      - name: Verify trading knowledge deployment bundle
        run: python scripts/build_trading_knowledge.py --check
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure free FFmpeg tools for real Task 46 MP4 regression
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Explicitly exercise Task 46 real MP4 and original WAV tests
        run: python -m unittest discover -s tests -p "test_flora_video_ads.py" -v
      - name: Test private profile storage and consent
        run: node --test tests/profile-store.test.cjs
      - name: Test first-audio synthesis priority and cancellation
        run: node --test tests/speech-pipeline.test.cjs
      - name: Test natural-language reminder parser
        run: node --test tests/reminder-parser.test.cjs
      - name: Test local time/date command parser
        run: node --test tests/assistant-commands.test.cjs
      - name: Test local memory privacy filter
        run: node --test tests/memory-privacy.test.cjs
      - name: Check reminder parser JavaScript syntax
        run: node --check reminder-parser.js
      - name: Test product-ad intent router
        run: node --test tests/hoshi-product-ads.test.cjs
      - name: Check product-ad workflow script syntax
        run: node --check hoshi-product-ads.js
      - name: Test Hoshi client task router
        run: node --test tests/hoshi-task-router.test.cjs
      - name: Test Urdu and Roman Urdu speech parsing
        run: node --test tests/hoshi-speech-input.test.cjs
      - name: Check Urdu speech parser syntax
        run: node --check hoshi-speech-input.js
      - name: Test bounded local Hoshi UI actions
        run: node --test tests/hoshi-local-ui-actions.test.cjs
      - name: Check local UI actions JavaScript syntax
        run: node --check hoshi-local-ui-actions.js
      - name: Test source research commands and safe citation DOM
        run: node --test tests/hoshi-source-research.test.cjs
      - name: Check source research JavaScript syntax
        run: node --check hoshi-source-research.js
      - name: Check client task router syntax
        run: node --check hoshi-task-router.js
      - name: Check paper research client syntax
        run: node --check hoshi-trading-research.js
      - name: Test annotated chart evidence and export safety
        run: node --test tests/hoshi-annotated-chart.test.cjs
      - name: Test offline Game Studio Canvas preview engine
        run: node --test tests/hoshi-game-engine.test.cjs
      - name: Test Task 52 playable game rules and opt-in saves
        run: node --test tests/hoshi-gameplay.test.cjs
      - name: Test Task 53 randomized game state and crash invariants
        run: node --test tests/hoshi-game-qa.test.cjs
      - name: Check Task 53 browser QA syntax
        run: node --check tests/game-studio-qa.e2e.cjs
      - name: Check offline Game Studio gameplay syntax
        run: node --check game-studio/gameplay.mjs
      - name: Check offline Game Studio engine JavaScript syntax
        run: node --check game-studio/engine.mjs
      - name: Check annotated chart JavaScript syntax
        run: node --check hoshi-annotated-chart.js
      - name: Test opt-in local memory export and deletion
        run: node --test tests/hoshi-memory-store.test.cjs
      - name: Check local memory store JavaScript syntax
        run: node --check hoshi-memory-store.js
      - name: Test payload-free client diagnostics
        run: node --test tests/hoshi-diagnostics.test.cjs
      - name: Check client diagnostics JavaScript syntax
        run: node --check hoshi-diagnostics.js
      - name: Check memory privacy JavaScript syntax
        run: node --check memory-privacy.js
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
      - name: Check dashboard inline JavaScript syntax
        run: |
          node -e 'const fs = require("node:fs"); const html = fs.readFileSync("index.html", "utf8"); const match = html.match(/<script>([\s\S]*?)<\/script>/i); if (!match) { throw new Error("No inline script found in index.html"); } new Function(match[1]); console.log("Dashboard JavaScript syntax: OK");'
      - name: Install Playwright Chromium for browser smoke tests
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run real-browser dashboard smoke tests
        run: node tests/dashboard.e2e.cjs
      - name: Check Game Studio browser test syntax
        run: node --check tests/game-studio.e2e.cjs
      - name: Run real-browser Game Studio template smoke tests
        run: node tests/game-studio.e2e.cjs
      - name: Run Task 53 real-browser full-game and failure-path QA
        run: node tests/game-studio-qa.e2e.cjs

